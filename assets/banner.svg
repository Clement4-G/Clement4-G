<svg xmlns="http://www.w3.org/2000/svg" width="880" height="250" viewBox="0 0 880 250" role="img" aria-labelledby="t d">
  <title id="t">Clément GAST · Business × IA</title>
  <desc id="d">Cartel de musée animé : nom, positionnement et recherche de stage.</desc>
  <style>
    .serif { font-family: 'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif; }
    .mono { font-family: 'Cascadia Mono', Consolas, 'Courier New', monospace; }
    .sans { font-family: 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif; }
    .rise { opacity: 0; animation: rise 0.9s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    .r1 { animation-delay: 0.1s; } .r2 { animation-delay: 0.35s; } .r3 { animation-delay: 0.7s; } .r4 { animation-delay: 1.1s; }
    .line { stroke-dasharray: 520; stroke-dashoffset: 520; animation: draw 1.6s 0.5s ease-out forwards; }
    .dot { animation: pulse 1.6s 2s ease-in-out infinite; }
    .shine { animation: shine 7s 2.2s ease-in-out infinite; }
    @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    @keyframes pulse { 50% { opacity: 0.25; } }
    @keyframes shine { 0%, 70% { transform: translateX(-200px) skewX(-20deg); } 100% { transform: translateX(1000px) skewX(-20deg); } }
    @media (prefers-reduced-motion: reduce) {
      .rise, .line, .dot { animation: none; opacity: 1; stroke-dashoffset: 0; }
      .shine { display: none; }
    }
  </style>
  <defs>
    <linearGradient id="gloss" x1="0" x2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="card"><rect x="4" y="4" width="872" height="242" rx="14"/></clipPath>
  </defs>
  <rect x="4" y="4" width="872" height="242" rx="14" fill="#f4f1ea" stroke="#1b1b1b" stroke-width="2"/>
  <rect x="14" y="14" width="852" height="222" rx="8" fill="none" stroke="#85641f" stroke-width="1"/>
  <g clip-path="url(#card)"><rect class="shine" x="0" y="0" width="120" height="250" fill="url(#gloss)"/></g>
  <text class="mono rise r1" x="48" y="62" font-size="13" letter-spacing="2.4" fill="#5b574e">CLÉMENT GAST · PORTFOLIO</text>
  <text class="serif rise r2" x="46" y="128" font-size="58" fill="#1b1b1b" letter-spacing="-1">Business × IA</text>
  <line class="line" x1="48" y1="152" x2="568" y2="152" stroke="#85641f" stroke-width="2"/>
  <text class="sans rise r3" x="48" y="186" font-size="17" fill="#1b1b1b">Je construis des sites web et des outils IA, avec un regard formé au commerce.</text>
  <g class="rise r4">
    <rect x="48" y="203" width="206" height="26" rx="13" fill="#1b1b1b"/>
    <circle class="dot" cx="66" cy="216" r="4" fill="#5ef2b0"/>
    <text class="sans" x="78" y="221" font-size="13" font-weight="600" fill="#f4f1ea">Je cherche un stage</text>
  </g>
  <g class="rise r3" transform="translate(700 44)">
    <rect width="132" height="150" fill="#0b1118" stroke="#1b1b1b" stroke-width="6"/>
    <rect x="9" y="9" width="114" height="132" fill="none" stroke="#85641f" stroke-width="1.5"/>
    <path d="M20 118 C 40 60, 60 60, 72 92 S 104 60, 112 40" fill="none" stroke="#38d6ff" stroke-width="2.5"/>
    <circle cx="112" cy="40" r="5" fill="#f0c860"/>
    <text class="mono" x="66" y="176" font-size="10" text-anchor="middle" fill="#5b574e">salles 01 → 04</text>
  </g>
</svg>
