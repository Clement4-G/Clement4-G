<svg xmlns="http://www.w3.org/2000/svg" width="880" height="300" viewBox="0 0 880 300" role="img" aria-labelledby="t d">
  <title id="t">Plan du musée-portfolio</title>
  <desc id="d">Quatre salles reliées par des flèches, que des agents parcourent : projets IA, trading et finance, stack et méthode, à propos et contact.</desc>
  <style>
    .serif { font-family: 'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif; }
    .mono { font-family: 'Cascadia Mono', Consolas, 'Courier New', monospace; }
    .room { opacity: 0; animation: room 0.6s cubic-bezier(0.2, 1.4, 0.4, 1) forwards; transform-box: fill-box; transform-origin: center; }
    .a1 { animation-delay: 0.2s; } .a2 { animation-delay: 0.6s; } .a3 { animation-delay: 1s; } .a4 { animation-delay: 1.4s; }
    .link { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 0.6s ease-in-out forwards; }
    .l1 { animation-delay: 1.9s; } .l2 { animation-delay: 2.2s; } .l3 { animation-delay: 2.5s; }
    .cursor { opacity: 0; animation: tour 12s 2.8s ease-in-out infinite; }
    .c2 { animation-delay: 6.8s; } .c3 { animation-delay: 10.8s; }
    @keyframes room { from { opacity: 0; transform: scale(0.86); } to { opacity: 1; transform: none; } }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    @keyframes tour {
      0% { opacity: 0; transform: translate(250px, 116px); }
      6% { opacity: 1; }
      25% { transform: translate(660px, 116px); }
      50% { transform: translate(660px, 248px); }
      75% { transform: translate(250px, 248px); }
      94% { opacity: 1; }
      100% { opacity: 0; transform: translate(250px, 116px); }
    }
    @media (prefers-reduced-motion: reduce) {
      .room, .link { animation: none; opacity: 1; stroke-dashoffset: 0; }
      .cursor { animation: none; opacity: 1; transform: translate(660px, 116px); }
      .c2, .c3 { display: none; }
    }
  </style>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#e2dccb"/></pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#85641f"/></marker>
  </defs>
  <rect x="4" y="4" width="872" height="292" rx="14" fill="#f4f1ea" stroke="#1b1b1b" stroke-width="2"/>
  <rect x="5" y="5" width="870" height="290" rx="13" fill="url(#grid)" opacity="0.7"/>
  <g class="room a1"><rect x="40" y="36" width="320" height="104" fill="#f4f1ea" stroke="#1b1b1b" stroke-width="4"/>
    <text class="serif" x="62" y="84" font-size="30" fill="#85641f">01</text><text class="serif" x="110" y="84" font-size="21" fill="#1b1b1b">Projets IA</text>
    <text class="mono" x="62" y="114" font-size="11" fill="#5b574e">IA hors ligne · coffre d’agents</text></g>
  <g class="room a2"><rect x="470" y="36" width="320" height="104" fill="#f4f1ea" stroke="#1b1b1b" stroke-width="4"/>
    <text class="serif" x="492" y="84" font-size="30" fill="#85641f">02</text><text class="serif" x="540" y="84" font-size="21" fill="#1b1b1b">Trading et finance</text>
    <text class="mono" x="492" y="114" font-size="11" fill="#5b574e">bot de démonstration</text></g>
  <g class="room a3"><rect x="470" y="168" width="320" height="104" fill="#f4f1ea" stroke="#1b1b1b" stroke-width="4"/>
    <text class="serif" x="492" y="216" font-size="30" fill="#85641f">03</text><text class="serif" x="540" y="216" font-size="21" fill="#1b1b1b">Stack et méthode</text>
    <text class="mono" x="492" y="246" font-size="11" fill="#5b574e">site de Tethys · méthode IA</text></g>
  <g class="room a4"><rect x="40" y="168" width="320" height="104" fill="#f4f1ea" stroke="#1b1b1b" stroke-width="4"/>
    <text class="serif" x="62" y="216" font-size="30" fill="#85641f">04</text><text class="serif" x="110" y="216" font-size="21" fill="#1b1b1b">À propos et contact</text>
    <text class="mono" x="62" y="246" font-size="11" fill="#5b574e">parcours · passions · contact</text></g>
  <line class="link l1" pathLength="1" x1="370" y1="88" x2="456" y2="88" stroke="#85641f" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
  <line class="link l2" pathLength="1" x1="630" y1="144" x2="630" y2="158" stroke="#85641f" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
  <line class="link l3" pathLength="1" x1="460" y1="220" x2="374" y2="220" stroke="#85641f" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
  <g class="mono" font-size="10" font-weight="600">
    <g class="cursor"><path d="M0 0L0 14L4 10L8 17L10 16L6 9L12 9Z" fill="#0e7fb3" stroke="#ffffff" stroke-width="1"/><rect x="12" y="12" width="72" height="17" rx="5" fill="#0e7fb3"/><text x="18" y="24" fill="#ffffff">agent-plan</text></g>
    <g class="cursor c2"><path d="M0 0L0 14L4 10L8 17L10 16L6 9L12 9Z" fill="#b3261e" stroke="#ffffff" stroke-width="1"/><rect x="12" y="12" width="74" height="17" rx="5" fill="#b3261e"/><text x="18" y="24" fill="#ffffff">agent-code</text></g>
    <g class="cursor c3"><path d="M0 0L0 14L4 10L8 17L10 16L6 9L12 9Z" fill="#2f5d46" stroke="#ffffff" stroke-width="1"/><rect x="12" y="12" width="64" height="17" rx="5" fill="#2f5d46"/><text x="18" y="24" fill="#ffffff">agent-qa</text></g>
  </g>
  <text class="mono" x="836" y="288" font-size="10" text-anchor="end" fill="#5b574e">séquence reconstituée · le site a réellement été construit avec des agents IA</text>
</svg>
