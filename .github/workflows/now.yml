# Réécrit chaque jour la section « En ce moment » du README et le statut du terminal,
# à partir du site en ligne. Les tests tournent aussi à chaque envoi qui touche les scripts.
# Durcissement : actions épinglées sur une empreinte exacte, aucune dépendance installée,
# seul le job de mise à jour peut écrire, et il ne commite que si quelque chose a changé.
name: Section En ce moment

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/**', '.github/workflows/now.yml']

permissions:
  contents: read

concurrency:
  group: now
  # un envoi en cours va jusqu'au bout
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun test

  update:
    needs: test
    if: github.repository == 'Clement4-G/Clement4-G' && github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun scripts/update-now.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commiter si quelque chose a changé
        run: |
          if git diff --quiet -- README.md assets/terminal-dark.svg assets/terminal-light.svg; then echo "Rien à commiter."; exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md assets/terminal-dark.svg assets/terminal-light.svg
          git commit -m 'En ce moment : mise à jour automatique'
          git pull --rebase
          git push
